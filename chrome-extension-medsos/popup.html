<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <style>
    body {
      width: 330px;
      margin: 0;
      padding: 14px;
      font-family: system-ui, -apple-system, Segoe UI, sans-serif;
      background: #020617;
      color: #f8fafc;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 10px;
    }
    .badge {
      background: rgba(6, 182, 212, 0.2);
      border: 1px solid rgba(6, 182, 212, 0.45);
      color: #67e8f9;
      padding: 4px 8px;
      border-radius: 8px;
      font-size: 11px;
      font-weight: 700;
    }
    h1 {
      font-size: 14px;
      margin: 0;
      font-weight: 800;
    }
    p {
      font-size: 11px;
      color: #94a3b8;
      margin: 0 0 12px;
      line-height: 1.45;
    }
    label {
      display: block;
      font-size: 11px;
      font-weight: 700;
      color: #cbd5e1;
      margin-bottom: 5px;
    }
    select {
      width: 100%;
      padding: 8px 10px;
      border-radius: 10px;
      border: 1px solid #334155;
      background: #0f172a;
      color: #f8fafc;
      font-size: 12px;
      margin-bottom: 10px;
    }
    .btn {
      width: 100%;
      border: none;
      border-radius: 10px;
      padding: 10px 12px;
      font-size: 12px;
      font-weight: 800;
      cursor: pointer;
      margin-bottom: 7px;
      transition: opacity 0.15s;
    }
    .btn:disabled {
      opacity: 0.5;
      cursor: wait;
    }
    .btn-primary {
      background: linear-gradient(90deg, #0891b2, #4f46e5);
      color: white;
    }
    .btn-secondary {
      background: #1e293b;
      color: #e2e8f0;
      border: 1px solid #334155;
    }
    #status {
      margin-top: 8px;
      padding: 8px 10px;
      border-radius: 9px;
      font-size: 11px;
      line-height: 1.4;
      display: none;
    }
    .ok {
      background: rgba(16, 185, 129, 0.18);
      border: 1px solid rgba(16, 185, 129, 0.45);
      color: #a7f3d0;
    }
    .err {
      background: rgba(245, 158, 11, 0.18);
      border: 1px solid rgba(245, 158, 11, 0.45);
      color: #fde68a;
    }
  </style>
</head>
<body>
  <div class="header">
    <span class="badge">🏡 Villa HQ</span>
    <h1>Jembatan Medsos Live</h1>
  </div>
  <p>Kirim tab yang sedang Anda buka ini (IG, TikTok Studio, Meta Ads, Shopee) langsung ke memori agen tanpa perlu login ulang.</p>

  <label for="agentSelect">Pilih Spesialis Tujuan:</label>
  <select id="agentSelect">
    <option value="social-media">📱 Nadia — Sosial Media Spesialist</option>
    <option value="kol">🌟 Salsa — KOL Spesialist</option>
    <option value="ads">🎯 Kevin — Ads Spesialist</option>
    <option value="campaign">🚀 Bima — Campaign Spesialist</option>
    <option value="marketplace">🛍️ Putri — Marketplace Spesialist</option>
    <option value="research">📊 Arka — Analisis & Riset</option>
    <option value="seo">🔍 Dimas — SEO Spesialist</option>
    <option value="content-creator">✍️ Tiara — Content Creator</option>
  </select>

  <button id="btnAnalyze" class="btn btn-primary">⚡ Kirim Tab & Minta Analisis Sekarang</button>
  <button id="btnSyncOnly" class="btn btn-secondary">📸 Simpan Snapshot Saja ke Villa HQ</button>

  <div id="status"></div>

  <script src="popup.js"></script>
</body>
</html>
